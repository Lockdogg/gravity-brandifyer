<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
      padding: 24px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p { color: #666; margin-bottom: 24px; }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-close { background: #f0f0f0; color: #1a1a1a; }
  </style>
</head>
<body>
  <h1>Brand Manager</h1>
  <p id="status">Загружается…</p>
  <button class="btn-close" id="closeBtn">Закрыть</button>
  <script src="ui.js"></script>
</body>
</html>
