<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
      padding: 20px;
    }

    h1 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    h2 { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #444; text-transform: uppercase; letter-spacing: .04em; }

    section { margin-bottom: 20px; }

    .brand-list { list-style: none; padding: 0; }
    .brand-list li { padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
    .brand-list li.empty { color: #999; font-style: italic; }

    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #f0f0f0; }
    th { color: #888; font-weight: 500; }

    .swatch {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 2px;
      border: 1px solid rgba(0,0,0,.1);
      vertical-align: middle;
      margin-right: 4px;
    }

    .meta { color: #666; }
    .note { color: #888; font-size: 11px; margin-top: 4px; }
    .hint { color: #999; font-size: 11px; line-height: 1.5; margin-top: 4px; }
    .wip { color: #999; font-size: 11px; margin-top: 16px; }

    button {
      margin-top: 8px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      background: #f0f0f0;
      color: #1a1a1a;
    }
    button:hover { background: #e4e4e4; }

    .error-screen { text-align: center; padding: 32px 16px; }
    .error-icon { font-size: 32px; margin-bottom: 12px; }
    .error-screen h2 { font-size: 15px; margin-bottom: 8px; color: #1a1a1a; text-transform: none; letter-spacing: 0; }
    .error-screen p { color: #666; margin-bottom: 8px; line-height: 1.5; }
    .error-screen .missing { background: #fff3cd; border-radius: 6px; padding: 8px; color: #856404; }
    .error-screen .hint { font-size: 11px; color: #999; }

    .alert {
      display: flex;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid;
      margin-top: 12px;
      line-height: 1.45;
    }
    .alert-icon { flex-shrink: 0; margin-top: 1px; width: 16px; height: 16px; }
    .alert-icon svg { width: 16px; height: 16px; display: block; fill: currentColor; }
    .alert-body { flex: 1; }
    .alert-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .alert-desc { font-size: 12px; }

    .alert-success { background: #f0faf4; border-color: #b7e4c7; color: #1a6334; }
    .alert-error   { background: #fff5f5; border-color: #ffc9c9; color: #c92a2a; }
    .alert-warning { background: #fffbeb; border-color: #ffe08a; color: #6d4c00; }
    .alert-warning .alert-desc { color: #555; }
    .alert-info    { background: #f8f9fa; border-color: #dee2e6; color: #1a1a1a; }
    .alert-info .alert-desc { color: #666; }

    .seg-control {
      display: inline-flex;
      background: #efefef;
      border-radius: 9px;
      padding: 2px;
    }
    .seg-btn {
      flex: 1;
      min-width: 88px;
      padding: 6px 16px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #666;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin: 0;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .seg-btn:hover:not(.seg-active) { background: rgba(0,0,0,.05); }
    .seg-btn.seg-active { background: #1a1a1a; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); }

    .family-select-all {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0 8px;
      border-bottom: 2px solid #e8e8e8;
      margin-bottom: 2px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
    }
    .family-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      border-bottom: 1px solid #f0f0f0;
    }
    .family-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .family-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      visibility: hidden;
    }
    .family-picker.visible { visibility: visible; }

    /* ---- Custom ColorPicker ---- */
    .cp-popup { position: fixed; width: 252px; background: #fff; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,.2), 0 0 0 1px rgba(0,0,0,.08); z-index: 10000; display: none; flex-direction: column; overflow: visible; user-select: none; }
    .cp-grad-wrap { position: relative; width: 100%; height: 180px; cursor: crosshair; border-radius: 8px 8px 0 0; overflow: hidden; flex-shrink: 0; }
    .cp-grad-canvas { width: 100%; height: 100%; display: block; }
    .cp-grad-thumb { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); transform: translate(-50%,-50%); pointer-events: none; }
    .cp-sliders { padding: 12px 12px 0; display: flex; flex-direction: column; gap: 8px; }
    .cp-row-wrap { position: relative; height: 10px; border-radius: 5px; cursor: ew-resize; overflow: hidden; }
    .cp-hue-canvas { width: 100%; height: 100%; display: block; }
    .cp-hue-thumb { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 1px 4px rgba(0,0,0,.2); transform: translate(-50%,-50%); pointer-events: none; }
    .cp-bottom { display: flex; align-items: center; padding: 10px 12px 12px; gap: 6px; }
    .cp-mode-wrap { position: relative; flex-shrink: 0; }
    .cp-mode-btn { background: #f0f0f0; border: none; border-radius: 5px; padding: 5px 8px; font-size: 11px; font-weight: 500; color: #333; cursor: pointer; white-space: nowrap; margin: 0; font-family: inherit; display: flex; align-items: center; gap: 3px; }
    .cp-mode-btn:hover { background: #e8e8e8; }
    .cp-caret { opacity: .5; font-size: 8px; }
    .cp-mode-drop { display: none; position: absolute; bottom: calc(100% + 4px); left: 0; background: #2c2c2c; border-radius: 6px; padding: 4px; z-index: 1; min-width: 72px; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
    .cp-mode-drop.cp-open { display: block; }
    .cp-mode-opt { padding: 5px 10px; color: #eee; font-size: 12px; border-radius: 4px; cursor: pointer; }
    .cp-mode-opt:hover { background: rgba(255,255,255,.15); }
    .cp-values { flex: 1; display: flex; gap: 3px; min-width: 0; }
    .cp-val { flex: 1; min-width: 0; padding: 5px 2px; border: none; border-radius: 4px; background: #f0f0f0; font-size: 11px; text-align: center; color: #333; font-family: inherit; }
    .cp-val:focus { outline: none; background: #e4e4e4; }
    .cp-val-hex { font-family: monospace; letter-spacing: .02em; }
    .color-swatch { width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(0,0,0,.15); cursor: pointer; padding: 0; flex-shrink: 0; margin: 0; transition: border-color 0.1s; }
    .color-swatch:hover { border-color: rgba(0,0,0,.35); }

    #helpToggle svg { width: 16px; height: 16px; display: block; fill: currentColor; }
    #helpToggle:hover { color: #555 !important; }

    #toast-container {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: all;
      animation: toast-in 0.2s ease forwards;
    }
    .toast.toast-hiding {
      animation: toast-out 0.25s ease forwards;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(4px); }
    }

    #app { min-height: 100%; }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div id="app">
    <p style="color:#999; padding:20px 0;">Загружается…</p>
  </div>
  <script src="ui.js"></script>
</body>
</html>
